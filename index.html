    <title>Guia de Chem — Dumont Station</title>
    <script>
      // Aplica o tema antes da pintura para evitar flash. A preferência é local.
      (() => {
        try {
          const saved = localStorage.getItem('chem:tema');
          const theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'light' ? '#f4f1e8' : '#0c1210');
        } catch {
          /* localStorage pode estar bloqueado. */
        }
      })();
    </script>
